apiVersion: v1
kind: Service
metadata:
  name: ecgense
  namespace: ecgense
spec:
  type: NodePort
  selector:
    app: ecgense
  ports:
    - port: 80          # port inside the cluster
      targetPort: 5000  # port the Flask/gunicorn container listens on
      nodePort: 30500   # different from PBL3's 30080
